<body>
<div class="chat-app">
  <header class="chat-head">
    <div class="head-row">
      <div class="head-id">
        <span class="blob warren sm" aria-hidden="true"></span>
        <div class="head-copy">
          <h1 data-i18n="agentWarren">Warren</h1>
          <p class="head-sub"><span class="role" data-i18n="agentWarrenRole">Trader</span><span class="dotsep">·</span><span data-i18n="appTitle">Trader League</span></p>
        </div>
      </div>
      <div class="hbtns">
        <div class="langwrap">
          <button class="lang" id="lang-btn" type="button" aria-haspopup="true"
                  aria-expanded="false" aria-controls="lang-menu"><span id="lang-label"></span></button>
          <div class="langmenu" id="lang-menu" role="menu" hidden></div>
        </div>
      </div>
    </div>
    <div class="agent-strip" id="agent-strip" role="list"></div>
    <div class="hbar">
      <span class="chip" id="hchip"><span data-i18n="allPlayers"></span> <span class="caret">▾</span></span>
      <span class="period" data-i18n="periodAll"></span>
    </div>
    <div class="eyebrow" id="eyebrow"></div>
  </header>

  <main class="thread">
    <div class="day-sep" id="day-sep"></div>

    <article class="turn" data-agent="warren" data-watch="pending-card">
      <span class="blob warren" aria-hidden="true"></span>
      <div class="turn-body">
        <div class="turn-who"><strong data-i18n="agentWarren"></strong><span class="role" data-i18n="agentWarrenRole"></span></div>
        <p class="say" id="say-pending"></p>
<section class="card warn" id="pending-card" style="display:none">
    <h2 data-i18n="pendingTitle"></h2>
    <div class="wsub" id="pending" style="margin-top:6px"></div>
  </section>
      </div>
    </article>

    <div id="widgets" class="widgets">
    <article class="turn" data-agent="warren">
      <span class="blob warren" aria-hidden="true"></span>
      <div class="turn-body">
        <div class="turn-who"><strong data-i18n="agentWarren"></strong><span class="role" data-i18n="agentWarrenRole"></span></div>
        <p class="say" id="say-standings"></p>
<section class="card" id="hero-card">
      <a class="gpban ca-banner" id="ca-banner" target="_blank" rel="noopener noreferrer"
         data-i18n-aria="caAria">
        <span class="cicon" aria-hidden="true">🍁</span>
        <span class="ctext">
          <span class="ckicker" data-i18n="caTitle"></span>
          <span class="cmain" data-i18n="gpTitle"></span>
          <span class="csub" data-i18n="caSub"></span>
        </span>
        <span class="carrow" aria-hidden="true">→</span>
      </a>
      <!-- quién va ganando el Gran Premio: el líder de la general con su
           acumulado y la ventaja sobre el segundo, y el resto del podio. -->
      <div class="gp" id="gp">
        <div class="gp-lead" id="gp-lead">
          <span class="gp-flag" aria-hidden="true">🏁</span>
          <div class="gp-l">
            <div class="gp-kicker" data-i18n="gpLeading"></div>
            <div class="gp-name"><span id="gp-name"></span
              ><span class="leaf" aria-hidden="true">🍁</span></div>
            <div class="gp-gap" id="gp-gap"></div>
          </div>
          <div class="gp-cum num" id="gp-cum"></div>
        </div>
        <div class="gp-podium" id="gp-podium" style="display:none">
          <span class="gp-plabel" data-i18n="gpPodium"></span>
          <div class="gp-chips" id="gp-chips"></div>
        </div>
      </div>
      <div class="gp-h2">
        <h2 data-i18n="ranking"></h2>
        <button class="whelp" id="hero-help" type="button" data-i18n-title="calcHelpAria">?</button>
      </div>
      <div class="overx" style="margin-top:12px"><table id="standings"></table></div>
    </section>
      </div>
    </article>
    <article class="turn" data-agent="warren" data-watch="best-card">
      <span class="blob warren" aria-hidden="true"></span>
      <div class="turn-body">
        <div class="turn-who"><strong data-i18n="agentWarren"></strong><span class="role" data-i18n="agentWarrenRole"></span></div>
        <p class="say" id="say-day"></p>
<section class="card widget" id="best-card">
      <div class="wlabel"><span data-i18n="bestOfDay"></span><span id="best-date"></span></div>
      <div class="mhead">
        <div class="mhead-l"><div class="bestname" id="best-name"></div></div>
        <div class="wbig"><span class="num" id="best-val"></span></div>
      </div>
    </section>
      </div>
    </article>
    <article class="turn" data-agent="warren" data-watch="month-row">
      <span class="blob warren" aria-hidden="true"></span>
      <div class="turn-body">
        <div class="turn-who"><strong data-i18n="agentWarren"></strong><span class="role" data-i18n="agentWarrenRole"></span></div>
        <p class="say" id="say-month"></p>
<div class="mrow" id="month-row" style="display:none">
      <!-- la interrogación de cada mes abre la escala del restaurante: qué
           categoría de sitio paga el ganador según su rentabilidad. -->
      <!-- Gran Premio de la ciudad de Vancouver: el mes en curso es su propia
           carrera y el banner de la ciudad (vancouver.ca) es su cabecera.
           Debajo va quién lo lleva ganado (líder y podio) y, al final, la
           gráfica de todos los jugadores de siempre: la comparativa entera. -->
      <section class="card widget month" id="month-cur-card">
        <a class="gpban vc-banner" id="vc-banner" target="_blank" rel="noopener noreferrer"
           data-i18n-aria="vcAria">
          <span class="cicon" aria-hidden="true">🏙️</span>
          <span class="ctext">
            <span class="ckicker" data-i18n="vcTitle"></span>
            <span class="cmain" id="vgp-title"></span>
            <span class="csub" data-i18n="vcSub"></span>
          </span>
          <span class="carrow" aria-hidden="true">→</span>
        </a>
        <div class="gp" id="vgp">
          <div class="gp-lead" id="vgp-lead">
            <span class="gp-flag" aria-hidden="true">🏁</span>
            <div class="gp-l">
              <div class="gp-kicker" data-i18n="vgpLeading"></div>
              <div class="gp-name"><span id="month-cur-player"></span
                ><span class="leaf" aria-hidden="true">🏆</span></div>
              <div class="gp-gap" id="vgp-gap"></div>
            </div>
            <div class="gp-cum"><span class="num" id="month-cur-val"></span></div>
          </div>
          <!-- quién invita y dónde va a ancho completo, bajo el líder: la
               frase con su chip no cabe junto al nombre sin descolgar el %. -->
          <div class="wsub treat" id="month-cur-note"></div>
          <div class="gp-podium" id="vgp-podium" style="display:none">
            <span class="gp-plabel" data-i18n="gpPodium"></span>
            <div class="gp-chips" id="vgp-chips"></div>
          </div>
        </div>
        <div class="gp-h2">
          <div class="wlabel" id="month-cur-label"></div>
          <button class="whelp" id="month-cur-help" type="button" data-i18n-title="treatHelpAria">?</button>
        </div>
        <div class="mchart" id="month-cur-chart"></div>
        <div class="legend mlegend" id="month-cur-legend"></div>
      </section>
      <!-- el mes pasado ya está cerrado: en la portada basta con el titular
           (quién ganó y con cuánto), igual que el «mejor del día». La gráfica de
           todo el mes y el resto de jugadores viven detrás de «ver más». -->
      <section class="card widget" id="month-prev-card">
        <button class="whelp" id="month-prev-help" type="button" data-i18n-title="treatHelpAria">?</button>
        <div class="wlabel" id="month-prev-label"></div>
        <div class="mhead">
          <div class="mhead-l">
            <div class="bestname"><span class="medal">🏆</span><span id="month-prev-player"></span></div>
          </div>
          <div class="wbig"><span class="num" id="month-prev-val"></span></div>
        </div>
        <div class="wsub treat" id="month-prev-note"></div>
        <button class="more" id="month-prev-more" type="button"></button>
      </section>
    </div>
      </div>
    </article>
    </div>

    <article class="turn" data-agent="warren" data-watch="ext-card">
      <span class="blob warren" aria-hidden="true"></span>
      <div class="turn-body">
        <div class="turn-who"><strong data-i18n="agentWarren"></strong><span class="role" data-i18n="agentWarrenRole"></span></div>
        <p class="say" id="say-ext"></p>
<section class="card" id="ext-card" style="display:none">
    <div class="ext-head">
      <div style="min-width:0">
        <div class="wlabel"><span id="ext-title"></span><span class="ext-when"
          ><span class="dot"></span><span id="ext-when"></span></span></div>
        <div class="wsub muted" id="ext-sub"></div>
      </div>
      <div class="wbig sm"><span class="num" id="ext-val"></span></div>
    </div>
    <div class="ext-list" id="ext-list"></div>
    <div class="wsub muted" id="ext-note" style="margin-top:10px"></div>
  </section>
      </div>
    </article>
    <article class="turn" data-agent="scout" data-watch="ops-card">
      <span class="blob scout" aria-hidden="true"></span>
      <div class="turn-body">
        <div class="turn-who"><strong data-i18n="agentScout"></strong><span class="role" data-i18n="agentScoutRole"></span></div>
        <p class="say" id="say-ops"></p>
<section class="card" id="ops-card" style="display:none">
    <div class="wlabel" data-i18n="recentOps"></div>
    <div id="ops-list" style="margin-top:8px"></div>
  </section>
      </div>
    </article>
    <article class="turn" data-agent="scout" data-watch="news-card">
      <span class="blob scout" aria-hidden="true"></span>
      <div class="turn-body">
        <div class="turn-who"><strong data-i18n="agentScout"></strong><span class="role" data-i18n="agentScoutRole"></span></div>
        <p class="say" id="say-news"></p>
<section class="card" id="news-card" style="display:none">
    <div class="wlabel"><span data-i18n="leagueNews"></span></div>
    <div class="wsub muted" id="news-sub"></div>
    <div id="news-feed" style="margin-top:8px"></div>
    <div class="wsub muted" id="news-note" style="margin-top:10px"></div>
  </section>
      </div>
    </article>
    <article class="turn" data-agent="warren" data-watch="insights-card">
      <span class="blob warren" aria-hidden="true"></span>
      <div class="turn-body">
        <div class="turn-who"><strong data-i18n="agentWarren"></strong><span class="role" data-i18n="agentWarrenRole"></span></div>
        <p class="say" id="say-insights"></p>
<section class="card" id="insights-card" style="display:none">
    <div class="ai-head">
      <span class="ai-badge" data-i18n="aiBadge"></span>
      <span class="ai-title" data-i18n="insightsTitle"></span>
      <span class="ai-live"><span class="dot"></span><span data-i18n="aiLive"></span></span>
    </div>
    <div class="insights" id="insights"></div>
  </section>
      </div>
    </article>
    <article class="turn" data-agent="warren" data-watch="daily-card">
      <span class="blob warren" aria-hidden="true"></span>
      <div class="turn-body">
        <div class="turn-who"><strong data-i18n="agentWarren"></strong><span class="role" data-i18n="agentWarrenRole"></span></div>
        <p class="say" id="say-daily"></p>
<section class="card" id="daily-card" style="display:none">
    <h2 id="daily-title"></h2>
    <div class="overx" style="margin-top:6px"><table id="daily"></table></div>
  </section>
      </div>
    </article>
    <article class="turn" data-agent="scout" data-watch="alloc-card">
      <span class="blob scout" aria-hidden="true"></span>
      <div class="turn-body">
        <div class="turn-who"><strong data-i18n="agentScout"></strong><span class="role" data-i18n="agentScoutRole"></span></div>
        <p class="say" id="say-alloc"></p>
<section class="card" id="alloc-card" style="display:none">
    <div class="wlabel" data-i18n="leagueWallet"></div>
    <div id="alloc-bars"></div>
    <div class="alloc-insight" id="alloc-insight"></div>
  </section>
      </div>
    </article>
    <article class="turn" data-agent="scout" data-watch="wallets-card">
      <span class="blob scout" aria-hidden="true"></span>
      <div class="turn-body">
        <div class="turn-who"><strong data-i18n="agentScout"></strong><span class="role" data-i18n="agentScoutRole"></span></div>
        <p class="say" id="say-wallets"></p>
<section class="card" id="wallets-card" style="display:none">
    <h2 data-i18n="walletsTitle"></h2>
    <div id="wallets" style="margin-top:4px"></div>
  </section>
      </div>
    </article>
    <article class="turn" data-agent="warren" data-watch="monthly-card">
      <span class="blob warren" aria-hidden="true"></span>
      <div class="turn-body">
        <div class="turn-who"><strong data-i18n="agentWarren"></strong><span class="role" data-i18n="agentWarrenRole"></span></div>
        <p class="say" id="say-monthly"></p>
<section class="card" id="monthly-card">
    <h2 data-i18n="monthlyDetailTitle"></h2>
    <div id="detail" style="margin-top:4px"></div>
  </section>
      </div>
    </article>
    <article class="turn" data-agent="warren" data-watch="goal-card">
      <span class="blob warren" aria-hidden="true"></span>
      <div class="turn-body">
        <div class="turn-who"><strong data-i18n="agentWarren"></strong><span class="role" data-i18n="agentWarrenRole"></span></div>
        <p class="say" id="say-goal"></p>
<section class="card" id="goal-card" style="display:none">
    <div class="goal-head">
      <div class="goal-l">
        <h2 data-i18n="goalTitle"></h2>
        <div class="wsub muted" id="goal-fx" style="display:none"></div>
      </div>
      <div class="goal-count">
        <span class="num" id="goal-days"></span>
        <span class="lbl" id="goal-days-lbl"></span>
      </div>
    </div>
    <div id="goal-list" style="margin-top:14px"></div>
  </section>
      </div>
    </article>
    <article class="turn" data-agent="warren" data-watch="badges-card">
      <span class="blob warren" aria-hidden="true"></span>
      <div class="turn-body">
        <div class="turn-who"><strong data-i18n="agentWarren"></strong><span class="role" data-i18n="agentWarrenRole"></span></div>
        <p class="say" id="say-badges"></p>
<section class="card" id="badges-card" style="display:none">
    <h2 data-i18n="badgesTitle"></h2>
    <div class="wsub muted" data-i18n="badgesSub" style="margin-top:2px"></div>
    <section class="card widget record" id="record-card" style="display:none;margin-top:12px">
      <div class="wlabel"><span data-i18n="recordTitle"></span><span id="record-date"></span></div>
      <div class="wbig"><span class="num pos" id="record-val"></span><span class="record-tk" id="record-tk"></span></div>
      <div class="bestname" id="record-holders"></div>
      <div class="wsub muted" id="record-prev" style="margin-top:6px"></div>
    </section>
    <div id="badge-rail" class="badge-rail" style="margin-top:12px" tabindex="0"
         role="group" data-i18n-aria="badgesRailAria"></div>
    <div id="badge-nav" class="badge-nav" style="display:none"></div>
    <div class="wsub muted" id="badge-empty" style="display:none;margin-top:8px" data-i18n="badgesEmpty"></div>
  </section>
      </div>
    </article>
  </main>

  <a class="composer" id="upload-mail" href="mailto:ligatrader26@gmail.com" data-i18n-title="sendPositions">
    <span class="composer-plus" aria-hidden="true">+</span>
    <span class="composer-field" data-i18n="askWarren">Ask Warren</span>
    <span class="composer-mic" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5V7a3.5 3.5 0 1 0-7 0v4.5A3.5 3.5 0 0 0 12 15zm7-3.5a1 1 0 1 0-2 0 5 5 0 1 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-1.57A7 7 0 0 0 19 11.5z"/></svg>
    </span>
  </a>
</div>
<div class="modal" id="modal" aria-hidden="true">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" data-i18n-aria="detailAria">
    <div class="grab"></div>
    <div id="modal-body"></div>
  </div>
</div>
<footer data-i18n-html="footer"></footer>
