name: Ranking

# Solo apertura y cierre del mercado de EE. UU. (America/New_York), más
# disparos manuales y el aviso de docs/subir.html (`extracto-subido`).
# Sin cron intradía, sin pre/after extra, sin push de trader/**.
#
# GitHub cron habla UTC, el NYSE cambia con el DST:
#   apertura 09:30 ET = 13:30 UTC (EDT) / 14:30 UTC (EST)
#   cierre   16:00 ET = 20:00 UTC (EDT) / 21:00 UTC (EST)
# Cuatro crons (minutos poco concurridos). El primer paso —antes de
# checkout o pip— sale al momento si la hora local de Nueva York no está
# a ~25 min de 09:30 o 16:00, así el hueco del DST contrario cuesta
# casi cero minutos.
#
# Al final, si docs/ cambió, se publica GitHub Pages aquí mismo
# (antes era .github/workflows/deploy-pages.yml).
# Requiere Pages → Build and deployment → Source: GitHub Actions.

on:
  schedule:
    # Apertura ~09:41 ET (11 min después de las 09:30).
    - cron: "41 13 * * 1-5"   # 09:41 EDT
    - cron: "41 14 * * 1-5"   # 09:41 EST
    # Cierre ~16:11 ET (11 min después de las 16:00).
    - cron: "11 20 * * 1-5"   # 16:11 EDT
    - cron: "11 21 * * 1-5"   # 16:11 EST
  workflow_dispatch:
    inputs:
      run_tests:
        description: Ejecutar pytest antes del ranking
        required: false
        type: boolean
        default: false
  # La web (docs/subir.html) lanza este evento tras subir un extracto: los
  # commits creados por la API de GitHub no disparan el evento `push`, así que
  # este `repository_dispatch` garantiza que el ranking se recalcule al subir.
  repository_dispatch:
    types: [extracto-subido]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

# Comparte cola con ingest: un solo escritor a main a la vez,
# para no disparar deploys de Pages en carrera (HTML viejo pisando al nuevo).
concurrency:
  group: league-publish
  cancel-in-progress: false

jobs:
  ranking:
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.docs.outputs.changed || 'false' }}
    steps:
      # Barato y sin checkout: el hueco DST contrario no instala Python.
      - name: ¿Ventana de apertura o cierre (America/New_York)?
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Disparo ${{ github.event_name }}: se corre el ranking."
            exit 0
          fi
          hour=$(TZ=America/New_York date +%-H)
          minute=$(TZ=America/New_York date +%-M)
          now=$((hour * 60 + minute))
          open=$((9 * 60 + 30))
          close=$((16 * 60))
          window=25
          d_open=$((now - open)); if [ "$d_open" -lt 0 ]; then d_open=$((-d_open)); fi
          d_close=$((now - close)); if [ "$d_close" -lt 0 ]; then d_close=$((-d_close)); fi
          stamp=$(TZ=America/New_York date +%H:%M)
          if [ "$d_open" -le "$window" ] || [ "$d_close" -le "$window" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Dentro de ventana (ahora ${stamp} ET)."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Fuera de ventana de apertura/cierre (ahora ${stamp} ET)." \
                 "Salgo sin ranking."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      # `checkout` se trae el commit que disparó el run (`github.sha`), que NO
      # tiene por qué ser la punta de main: los cron de Actions son «best
      # effort» y un run puede quedarse encolado horas (se han visto 7 h) y
      # arrancar cuando main ya ha avanzado. Calcular con esa foto vieja
      # publicaba un ranking sin las operaciones ingeridas mientras tanto, así
      # que nos ponemos siempre sobre la última main antes de nada.
      - name: Situarse en el último main
        if: steps.gate.outputs.run == 'true'
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Calculando sobre $(git rev-parse --short HEAD)"
          echo "DOCS_TREE_BEFORE=$(git rev-parse HEAD:docs)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Tests
        if: >
          steps.gate.outputs.run == 'true'
          && github.event_name == 'workflow_dispatch'
          && inputs.run_tests
        run: python -m pytest tests/ -q

      - name: Calcular ranking
        if: steps.gate.outputs.run == 'true'
        env:
          # Frase de paso COMPARTIDA de la liga: con ella se cifran (y se
          # descifran) todos los extractos. Créala UNA sola vez en
          # Settings -> Secrets and variables -> Actions con nombre TRADER_KEY.
          # Añadir un jugador nuevo NO requiere tocar nada aquí ni crear más
          # secrets. Los extractos se suben sin PR desde docs/subir.html.
          TRADER_KEY: ${{ secrets.TRADER_KEY }}
        run: python -m trader ranking --refresh

      - name: Publicar resultados
        if: steps.gate.outputs.run == 'true'
        env:
          # Hace falta también aquí: si main avanza mientras calculábamos, este
          # paso vuelve a lanzar el cálculo sobre la versión nueva.
          TRADER_KEY: ${{ secrets.TRADER_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Puede coincidir con la ingesta, que regenera los mismos
          # ficheros derivados y empuja a la vez. Antes se rebasaba con
          # `-X theirs`, imponiendo nuestra versión: si la ingesta había
          # publicado una operación nueva mientras calculábamos, ese rebase
          # devolvía docs/index.html a un estado anterior a la operación (la
          # web perdía la compra, aunque el extracto y ranking.md sí la
          # tuvieran). Como docs/ y data/ son función de players/, lo correcto
          # ante una carrera es descartar nuestro cálculo y rehacerlo sobre la
          # main nueva, nunca reescribirla con datos viejos.
          for attempt in 1 2 3 4 5; do
            git add docs/ data/public/ data/prices/ data/badges.json
            if git diff --cached --quiet; then
              echo "Sin cambios que publicar"
              exit 0
            fi
            git commit -m "Actualizar ranking $(date -u +%F)"
            if git push origin HEAD:main; then
              echo "Publicado (intento $attempt)."
              exit 0
            fi
            echo "main ha avanzado durante el cálculo; recalculo sobre ella" \
                 "(intento $attempt)…"
            sleep 5
            git fetch origin main
            git reset --hard origin/main
            python -m trader ranking --refresh
          done
          echo "No se pudo publicar tras varios intentos." >&2
          exit 1

      - name: Avisar de extractos sin descifrar
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let pending = [];
            try { pending = JSON.parse(fs.readFileSync("pending.json", "utf8")); } catch (e) {}
            const MARKER = "Extractos sin descifrar";
            const list = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existing = list.find(i => !i.pull_request && i.title.includes(MARKER));

            if (pending.length) {
              const rows = pending.map(p => `- **${p.name}** (\`players/${p.id}/\`)`).join("\n");
              const body = [
                "Estos extractos están subidos pero **no se han podido descifrar** en el último recálculo:",
                "", rows, "",
                "Causa casi segura: la **frase de paso** con la que se cifró **no coincide con la de " +
                "la liga** (el secret `TRADER_KEY`). Solución: que esa persona **vuelva a subir** su " +
                "extracto desde `docs/subir.html` con la frase compartida correcta.",
                "", "_Esta issue se actualiza y se cierra sola cuando el extracto se descifra._",
              ].join("\n");
              if (existing) {
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
                  title: "⚠️ " + MARKER, body });
              }
            } else if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: "✅ Todos los extractos se descifran correctamente. Cierro." });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: "closed" });
            }

      - name: ¿Cambió docs/?
        id: docs
        if: success() && steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          after=$(git rev-parse origin/main:docs)
          if [ "${DOCS_TREE_BEFORE:-}" != "$after" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "docs/ ha cambiado; se publica Pages."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "docs/ igual que al empezar; no se redespliega Pages."
          fi

  pages:
    needs: ranking
    if: success() && needs.ranking.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
