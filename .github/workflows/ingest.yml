name: Ingesta

# Un solo workflow para los dos caminos de extracto:
#
# 1) Email: cada jugador envía su extracto de Revolut —el CSV que exporta la
#    app o el PDF de cuenta ("Account Statement")— como adjunto al buzón de
#    la liga. Apps Script (scripts/gmail-dispatch.gs) dispara
#    repository_dispatch tipo `email-recibido` al llegar un correo; este
#    job lee el buzón por IMAP, verifica el remitente por DMARC, convierte
#    el PDF a CSV si hace falta, lo cifra con la frase de la liga y lo
#    commitea en players/<id>/. Sin cron de sondeo: el correo es
#    event-driven. Los correos que no traen extracto se dejan sin leer.
#
# 2) CSV directo (sin IMAP): la rutina automática de Steve de Federico
#    (u otra automatización) lanza repository_dispatch tipo `ingest-csv`
#    con el CSV en base64. Misma validación/fusión/cifrado que el buzón.
#
# El jugador no necesita token de GitHub, ni ser colaborador, ni cifrar
# nada: solo enviar un email (o que Steve empuje el CSV).
#
# Configuración (una sola vez):
#   Secrets  (Settings -> Secrets and variables -> Actions -> Secrets):
#     TRADER_KEY   frase de paso compartida de la liga (ya existía)
#     IMAP_USER    dirección del buzón receptor (p.ej. liga.trader@gmail.com)
#     IMAP_PASS    contraseña de aplicación del buzón (Gmail: App Password)
#   Variables (... -> Variables):
#     PLAYER_EMAILS  JSON id -> {email|emails, name, currency, show_amounts};
#                    un jugador puede listar varias direcciones. p.ej.:
#       { "fede": {"emails":["fgarcialorca@gmail.com","fedegarcia@icloud.com"],
#                  "name":"Fede","currency":"USD","show_amounts":true,
#                  "goal":14000,"show_goal":true},
#         "ana":  {"email":"ana@gmail.com","name":"Ana","currency":"EUR","show_amounts":true} }
#   Opcional:
#     IMAP_HOST (secret/var, def. imap.gmail.com), IMAP_PORT (def. 993),
#     IMAP_MAILBOX (def. INBOX),
#     INBOX_TRUSTED_AUTHSERV (var, p.ej. mx.google.com): si se define, solo se
#       confía en la cabecera Authentication-Results de ese servidor.
#
# Disparo CSV desde fuera:
#   gh api repos/fedegarlo/trader/dispatches \
#     -f event_type=ingest-csv \
#     -f client_payload='{"player_id":"fede","csv_base64":"..."}'
# `player_id` es opcional (defecto: fede). `csv_base64` es obligatorio.
# Para probar a mano: Actions → Ingesta → Run workflow; si rellenas
# csv_base64 se usa el camino CSV, si no se lee el buzón por IMAP.

on:
  # Email: Apps Script llama al timbre. CSV: Steve / gh / automatización.
  repository_dispatch:
    types: [email-recibido, ingest-csv]
  workflow_dispatch:
    inputs:
      player_id:
        description: Id del jugador (carpeta players/<id>/) — solo camino CSV
        required: false
        default: fede
        type: string
      csv_base64:
        description: Extracto CSV en base64 (si se rellena, camino CSV; si no, IMAP)
        required: false
        type: string

permissions:
  contents: write

# Misma cola que ranking (league-publish): serializa publicaciones a main.
concurrency:
  group: league-publish
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Elegir camino
        id: kind
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ACTION: ${{ github.event.action }}
          HAS_CSV_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.csv_base64 != '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ] \
             && [ "$DISPATCH_ACTION" = "ingest-csv" ]; then
            echo "kind=csv" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_CSV_INPUT" = "true" ]; then
            echo "kind=csv" >> "$GITHUB_OUTPUT"
          else
            echo "kind=email" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Leer buzón e ingerir extractos
        if: steps.kind.outputs.kind == 'email'
        env:
          TRADER_KEY: ${{ secrets.TRADER_KEY }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          IMAP_MAILBOX: ${{ vars.IMAP_MAILBOX }}
          PLAYER_EMAILS: ${{ vars.PLAYER_EMAILS }}
          INBOX_TRUSTED_AUTHSERV: ${{ vars.INBOX_TRUSTED_AUTHSERV }}
        # El resultado se copia al resumen de la ejecución (la portada del run),
        # que es donde se ve de un vistazo si el extracto traía operaciones
        # nuevas ("N nueva(s)") o no, sin tener que abrir el log.
        run: |
          set -o pipefail
          printf '### Ingesta por email\n\n```\n' >> "$GITHUB_STEP_SUMMARY"
          python -m trader inbox | tee -a "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Ingerir CSV
        if: steps.kind.outputs.kind == 'csv'
        env:
          TRADER_KEY: ${{ secrets.TRADER_KEY }}
          PLAYER_EMAILS: ${{ vars.PLAYER_EMAILS }}
          PLAYER_ID: ${{ github.event.client_payload.player_id || inputs.player_id || 'fede' }}
          CSV_BASE64: ${{ github.event.client_payload.csv_base64 || inputs.csv_base64 }}
        # El resultado se copia al resumen de la ejecución (la portada del run),
        # de un vistazo se ve si el extracto traía operaciones nuevas.
        run: |
          set -euo pipefail
          if [ -z "${CSV_BASE64:-}" ]; then
            echo "Falta csv_base64 (client_payload del repository_dispatch" \
                 "o el input csv_base64 del workflow_dispatch)." >&2
            exit 1
          fi
          PLAYER_ID="${PLAYER_ID:-fede}"
          CSV_FILE="$(mktemp /tmp/revolut-XXXXXX.csv)"
          cleanup() { rm -f "$CSV_FILE"; }
          trap cleanup EXIT
          # -i ignora saltos de línea u otros no-alfabeto que meta el payload.
          printf '%s' "$CSV_BASE64" | base64 -d -i > "$CSV_FILE"
          if [ ! -s "$CSV_FILE" ]; then
            echo "El CSV decodificado está vacío." >&2
            exit 1
          fi
          printf '### Ingesta por CSV\n\n```\n' >> "$GITHUB_STEP_SUMMARY"
          python -m trader ingest-csv --player "$PLAYER_ID" "$CSV_FILE" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

      # Ojo con el nombre: esto NO mira si ha llegado correo/CSV (eso lo dice
      # el paso anterior), sino si algún extracto ha traído operaciones que no
      # estuvieran ya registradas. Un extracto reenviado, o exportado antes de
      # que Revolut refleje las últimas operaciones, no cambia ningún fichero.
      # Sin novedades no se lanza ranking ni publish (ahorro de minutos).
      - name: ¿Alguna operación nueva?
        id: changed
        run: |
          if [ -n "$(git status --porcelain players/)" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "Ningún extracto ha traído operaciones nuevas (ver el paso" \
                 "anterior: dice cuántas trae cada uno y cuántas son nuevas)."
          fi

      - name: Recalcular ranking
        if: steps.changed.outputs.yes == 'true'
        env:
          TRADER_KEY: ${{ secrets.TRADER_KEY }}
        run: python -m trader ranking --refresh

      - name: Publicar
        if: steps.changed.outputs.yes == 'true'
        env:
          # Hace falta también aquí: si la rama avanza mientras publicábamos,
          # este paso vuelve a lanzar el cálculo sobre la versión nueva.
          TRADER_KEY: ${{ secrets.TRADER_KEY }}
          INGEST_KIND: ${{ steps.kind.outputs.kind }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players/ docs/ data/public/ data/prices/ data/badges.json
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar"
            exit 0
          fi
          if [ "$INGEST_KIND" = "csv" ]; then
            msg="Ingesta de extracto CSV $(date -u +%F\ %H:%M)"
          else
            msg="Ingesta de extractos por email $(date -u +%F\ %H:%M)"
          fi
          git commit -m "$msg"
          # Puede coincidir con el workflow de ranking, que regenera los mismos
          # ficheros derivados (data/, docs/) y empuja a la vez. En players/ sí
          # manda lo nuestro (el extracto recién ingerido es el dato de origen),
          # así que el rebase se resuelve con -X theirs —que en un rebase se
          # refiere a los commits que reaplicamos, o sea a nosotros—. Los
          # derivados, en cambio, no se pueden imponer: se recalculan sobre la
          # rama nueva, ya con el extracto dentro, y el commit se corrige con
          # ese resultado.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Publicado (intento $attempt)."
              exit 0
            fi
            echo "La rama ha avanzado; rebaso y recalculo (intento $attempt)…"
            sleep 5
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase -X theirs "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort 2>/dev/null || true
              continue
            fi
            python -m trader ranking --refresh
            git add players/ docs/ data/public/ data/prices/ data/badges.json
            if [ "$(git rev-parse HEAD)" \
               = "$(git rev-parse "origin/${GITHUB_REF_NAME}")" ]; then
              # El rebase ha descartado nuestro commit por vacío: otra ejecución
              # ya había publicado este mismo extracto. No hay nada que corregir
              # (amend reescribiría el commit ajeno), solo publicar el recálculo
              # si aporta algo.
              if git diff --cached --quiet; then
                echo "El extracto ya estaba publicado; nada que hacer."
                exit 0
              fi
              git commit -m "$msg"
            else
              git commit --amend --no-edit
            fi
          done
          echo "No se pudo publicar tras varios intentos." >&2
          exit 1
