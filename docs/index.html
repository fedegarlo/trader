<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Página estática: este HTML, assets/app.css y assets/app.js no se
     regeneran con el ranking. Los datos llegan de api/league.json, que es lo
     único que escribe `python -m trader ranking`. -->
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="description" content="Trader League: Warren and Scout follow a Revolut trading league — standings, sessions, trades and news.">
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-android-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icon-ios.png?v=2">
<meta property="og:type" content="website">
<meta property="og:title" content="Trader League">
<meta property="og:description" content="Standings, sessions, trades and news of the Revolut trading league.">
<meta property="og:url" content="https://fedegarlo.github.io/trader/">
<meta property="og:image" content="https://fedegarlo.github.io/trader/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://fedegarlo.github.io/trader/og-image.png">
<link rel="manifest" href="manifest.webmanifest" id="manifest-link">
<meta name="apple-mobile-web-app-title" content="Trader League" id="app-title-meta">
<title>Trader League</title>
<link rel="stylesheet" href="assets/app.css?v=4">
<script src="assets/i18n.js?v=4" defer></script>
<script src="assets/app.js?v=4" defer></script>
</head>
<body>
<div class="app">
  <!-- escritorio: carril de agentes, como la ventana de Grok Bots -->
  <nav class="rail" id="rail">
    <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
    <div id="rail-list" style="display:contents"></div>
    <span class="spacer"></span>
    <a class="rail-plus" id="rail-mail" href="mailto:ligatrader26@gmail.com" aria-label="Send positions">+</a>
  </nav>

  <section class="pane">
    <header class="topbar">
      <button class="who-pill" id="who" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="who-menu">
        <span id="who-av"></span>
        <span class="nm" id="who-name">Trader League</span>
        <span class="sub" id="who-sub"></span>
        <span class="caret" aria-hidden="true">▾</span>
      </button>
      <div class="tb-actions">
        <button class="rbtn lang" id="lang-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="lang-menu"><span id="lang-label">EN</span></button>
        <button class="rbtn" id="refresh" type="button" aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
      </div>
      <div class="menu" id="who-menu" role="menu" hidden></div>
      <div class="menu" id="lang-menu" role="menu" hidden></div>
    </header>

    <div class="scroll" id="scroll">
      <main class="thread" id="thread">
        <div class="loading" id="loading">
          <span class="stack xl" aria-hidden="true"></span>
          <span class="typing"><span class="dots"><i></i><i></i><i></i></span><span id="loading-text">Pinging the league…</span></span>
        </div>
      </main>
    </div>

    <form class="composer" id="composer" autocomplete="off">
      <div class="chips" id="chips"></div>
      <div class="box">
        <a class="plus" id="upload-mail" href="mailto:ligatrader26@gmail.com" aria-label="Send positions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </a>
        <input id="ask" type="text" enterkeyhint="send" autocapitalize="off" spellcheck="false" placeholder="Message Warren" aria-label="Message">
        <button class="send" id="send" type="submit" disabled aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </div>
    </form>
  </section>
</div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detail">
    <div class="grab"></div>
    <div id="modal-body"></div>
  </div>
</div>
<noscript><p class="foot">Trader League needs JavaScript: the page reads its data from <a href="api/league.json">api/league.json</a>.</p></noscript>
</body>
</html>
