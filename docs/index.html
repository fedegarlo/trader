<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trader League</title>
</head>
<body>
<p>Cargando el hilo…</p>
<script>
(async () => {
  const n = 33;
  const parts = [];
  for (let i = 0; i < n; i++) {
    const id = String(i).padStart(2, "0");
    const res = await fetch("_pack/index.html.p" + id);
    if (!res.ok) throw new Error("pack " + id + " " + res.status);
    parts.push(await res.text());
  }
  const blob = new Blob([parts.join("")], {type: "text/html;charset=utf-8"});
  location.replace(URL.createObjectURL(blob));
})().catch((err) => {
  document.body.textContent = "No se pudo cargar la portada: " + err;
});
</script>
</body>
</html>
